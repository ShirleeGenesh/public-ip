name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "16.16.0"

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Dependencies
        run: yarn install

      - name: Lint
        run: yarn lint

      - name: Run Unit Tests
        run: yarn test

      - name: Build
        run: yarn build

      - name: Public IP (run local action)
        id: ip
        uses: ./

      - name: Integration Test
        run: |
          echo "IPv4: ${{ steps.ip.outputs.ipv4 }}"
          if [ -z "${{ steps.ip.outputs.ipv4 }}" ]; then
            echo "::error::ipv4 output is empty"
            exit 1
          fi

      - name: Code Coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
